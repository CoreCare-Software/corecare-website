name: Deploy exact Website One Login staging candidate

on:
  push:
    branches:
      - codex/website-mobile-one-login
    paths:
      - .github/staging-deploy/one-login-website-candidate

permissions:
  contents: read

concurrency:
  group: corecare-website-one-login-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.repository == 'CoreCare-Software/corecare-website' && github.actor == 'cselectricalservices11-coder'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 65b68990d7276adb8bd93e2f9daa0192
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact staging-only trigger and credentials
        shell: bash
        run: |
          set -euo pipefail
          expected='DEPLOY:corecare-website-staging:one-login-turnstile:2026-08-11'
          actual="$(tr -d '\r\n' < .github/staging-deploy/one-login-website-candidate)"
          test "$actual" = "$expected"
          test "$GITHUB_REF_NAME" = 'codex/website-mobile-one-login'
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::No supported Cloudflare API token secret is configured for this repository or organization.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.cloudflare.jsonc', 'utf8'));
          const staging = config?.env?.staging;
          if (config.name !== 'corecare-website') throw new Error('unexpected production service identity');
          if (staging?.name !== 'corecare-website-staging') throw new Error('unexpected staging service identity');
          if (staging?.workers_dev !== true || !Array.isArray(staging?.routes) || staging.routes.length !== 0) {
            throw new Error('staging must remain workers.dev-only with no routes');
          }
          const portal = staging.services?.find((item) => item.binding === 'CORECARE_PLATFORM_PORTAL');
          if (portal?.service !== 'corecare-platform-staging' || portal?.entrypoint !== 'PortalBroker') {
            throw new Error('staging Platform portal binding mismatch');
          }
          NODE

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit
      - run: npm run db:migrate:local
      - run: npm run check:staging

      - name: Deploy Website staging only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config wrangler.cloudflare.jsonc \
            --env staging \
            --message "one-login-turnstile-staging sha=${GITHUB_SHA} actor=${GITHUB_ACTOR}"

      - name: Record exact deployment identity
        shell: bash
        run: |
          {
            echo '## CoreCare Website staging deployment'
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Actor: ${GITHUB_ACTOR}"
            echo '- Worker: corecare-website-staging'
            echo '- Production deployment: NO'
            echo '- Remote migration: NO'
          } >> "$GITHUB_STEP_SUMMARY"
