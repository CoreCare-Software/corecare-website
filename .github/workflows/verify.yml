name: Verify CoreCare website

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: corecare-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/corecare-pre-push.mjs --plan
      - run: npm run lint
      - run: npm test
      - run: npm audit
      - run: npm run db:migrate:local
      - run: npm run check
      - run: npm run check:staging
