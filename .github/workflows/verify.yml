name: Verify CoreCare website

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: corecare-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/corecare-pre-push.mjs --plan
      - run: npm run lint
      - run: npm test
      - run: npm audit
      - run: npm run db:migrate:local
      - run: npm run check
      - run: npm run check:staging
